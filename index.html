<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>СӨЗ ҚҰРА ДА, ДЫБЫСТЫҚ ТАЛДАУ ЖАСА!</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#fff4a7,#f9d4f4 52%,#c9f4ff);font-family:'Times New Roman',serif;color:#15112b}main{max-width:1100px;margin:auto;padding:10px 14px 26px;text-align:center}h1{font-size:clamp(25px,4vw,47px);font-weight:900;color:#a60055;margin:6px 0;text-shadow:1px 1px #fff}h2{font-size:clamp(19px,2.7vw,31px);font-weight:900;color:#123cb0;margin:7px 0 11px}.status{display:flex;justify-content:space-between;align-items:center;font-size:clamp(18px,2.5vw,27px);font-weight:bold;color:#69118a}.photo{height:clamp(165px,29vh,275px);max-width:530px;margin:8px auto 12px;background:#fff;border:8px solid #ed2689;border-radius:24px;box-shadow:0 5px 0 #b21666;display:flex;align-items:center;justify-content:center;padding:10px}.photo img{height:100%;width:100%;object-fit:contain;image-rendering:auto}.answer{display:flex;justify-content:center;gap:clamp(3px,1vw,11px);margin:8px auto;max-width:100%;}.column{flex:0 1 70px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:9px}.target{width:100%;height:clamp(43px,7vw,72px);border:3px solid #402388;border-radius:12px;background:white;font-size:clamp(23px,4.6vw,49px);font-family:inherit;font-weight:900;color:#080808;cursor:pointer;touch-action:none}.circle{width:clamp(29px,5.7vw,55px);height:clamp(29px,5.7vw,55px);border:4px solid #563e8e;border-radius:50%;background:white;cursor:pointer;touch-action:none}.circle.red{background:#f02d40}.circle.blue{background:#006ef0}.instruction{font-size:clamp(21px,3.2vw,34px);color:#a50058;font-weight:900;margin:15px 0 10px}.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;background:#fff9ed;border:3px solid #efb321;border-radius:19px;padding:12px;margin:0 auto;max-width:960px}.tile{width:clamp(48px,7.6vw,76px);height:clamp(51px,7.8vw,77px);background:#ffe36a;border:3px solid #bd8300;border-radius:13px;font-family:inherit;font-size:clamp(28px,4.6vw,47px);font-weight:900;color:#090909;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px #ad7e12}.tile.selected{outline:5px solid #9b23d6;transform:scale(1.06)}.tile.used{opacity:.22;pointer-events:none}.color-tile{border-radius:50%;width:clamp(51px,7.8vw,73px);height:clamp(51px,7.8vw,73px)}.color-tile.red{background:#f02d40;border-color:#a70a21}.color-tile.blue{background:#006ef0;border-color:#004c9f}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:13px}.controls button{border:0;border-radius:14px;padding:12px 20px;background:#5c21b7;color:white;font:bold clamp(20px,2.5vw,27px) 'Times New Roman';cursor:pointer}.controls button.next{background:#078340}.controls button.prev{background:#264bb9}.navigator{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:12px auto;max-width:940px}.navbtn{width:clamp(34px,4vw,46px);height:clamp(34px,4vw,46px);border:2px solid #68349b;border-radius:9px;background:white;font:bold 21px "Times New Roman";color:#252035;cursor:pointer}.navbtn.done{background:#0d8c48;color:white;border-color:#086b35}.navbtn.pending{background:#ffde74}.navbtn.active{outline:4px solid #e01c7b}.controls button:disabled{opacity:.5}.message{transition:color .15s}.message{font-size:clamp(22px,3vw,34px);font-weight:900;min-height:38px;color:#075c2b;margin-top:8px}.message.error{color:#c30c23}.overlay{position:fixed;inset:0;background:#190a35bb;display:none;align-items:center;justify-content:center;z-index:30}.overlay.show{display:flex}.dialog{max-width:90vw;background:#fff4c7;padding:32px;border:7px solid #e32d95;border-radius:24px;text-align:center}.dialog h3{font-size:clamp(30px,5vw,55px);color:#a60055}.dialog button{background:#168a43;color:white;font:bold 30px 'Times New Roman';border:0;border-radius:15px;padding:15px 24px;cursor:pointer}.dragging{position:fixed;z-index:100;pointer-events:none;opacity:.86;transform:translate(-50%,-50%);width:68px;height:68px}.help{font-size:clamp(16px,2vw,23px);color:#153f9d;font-weight:bold;margin:5px 0 10px}@media(max-width:480px){main{padding:6px 5px 18px}.photo{border-width:5px}.answer{gap:3px}.target{border-width:2px;border-radius:7px}.circle{border-width:2px}.column{gap:5px}.tray{gap:5px;padding:8px}.tile{border-width:2px}}

/* Үлкен әріптер мен дыбыс түстері: тақта және телефон */
h1{font-size:clamp(23px,3.2vw,37px);line-height:1.08;margin:4px 0 7px}
h2{font-size:clamp(17px,2.15vw,25px);line-height:1.13;margin:5px 0 9px}
.instruction{font-size:clamp(19px,2.6vw,27px);line-height:1.08;margin:12px 0 8px}
.help{font-size:clamp(16px,1.85vw,21px);margin:5px 0 8px}
.message{font-size:clamp(19px,2.35vw,26px);line-height:1.13;min-height:28px;margin-top:7px}
.answer{width:100%;max-width:100%;gap:clamp(5px,1.1vw,14px);margin:13px auto 14px;align-items:stretch}
.column{flex:0 1 clamp(0px,calc((100vw - 40px)/var(--letters-count)),105px);width:clamp(0px,calc((100vw - 40px)/var(--letters-count)),105px);gap:11px}
.target{height:clamp(65px,9.2vw,102px);border:4px solid #402388;border-radius:13px;font-size:clamp(37px,6.5vw,72px);font-weight:900;box-shadow:0 3px 0 #b5a6d7}
.circle{width:clamp(45px,6.7vw,72px);height:clamp(45px,6.7vw,72px);border:4px solid #563e8e}
.tray{max-width:1050px;gap:clamp(7px,1.3vw,15px);padding:clamp(10px,1.7vw,18px)}
.tile{width:clamp(62px,9vw,103px);height:clamp(67px,9.5vw,108px);font-size:clamp(39px,6.3vw,73px);border-width:4px;border-radius:15px}
.color-tile{width:clamp(64px,9vw,100px);height:clamp(64px,9vw,100px);border-radius:50%}
.dragging{width:82px;height:82px;font-size:54px}
@media(max-width:600px){
 main{padding:7px 7px 18px}
 h1{font-size:clamp(22px,5.4vw,31px)}
 h2{font-size:clamp(16px,4.1vw,22px)}
 .photo{height:clamp(190px,31vh,290px);margin:8px auto 12px}
 .answer{gap:clamp(3px,1vw,7px)}
 .column{flex:0 1 calc((100vw - 25px - (var(--letters-count) - 1)*4px)/var(--letters-count));width:calc((100vw - 25px - (var(--letters-count) - 1)*4px)/var(--letters-count));gap:8px}
 .target{height:clamp(63px,14vw,83px);font-size:clamp(36px,9vw,56px);border-width:3px;border-radius:10px}
 .circle{width:clamp(42px,10vw,57px);height:clamp(42px,10vw,57px);border-width:3px}
 .instruction{font-size:clamp(19px,4.5vw,25px)}
 .message{font-size:clamp(18px,4.2vw,23px)}
 .tray{gap:8px;padding:10px 6px}
 .tile{width:clamp(60px,14vw,82px);height:clamp(65px,15vw,87px);font-size:clamp(38px,9vw,55px);border-width:3px}
 .color-tile{width:clamp(62px,14vw,83px);height:clamp(62px,14vw,83px)}
}
</style></head><body><main><h1>СӨЗ ҚҰРА ДА, ДЫБЫСТЫҚ ТАЛДАУ ЖАСА!</h1><h2>Суретке қара! Сөз құра! Әр дыбысты тиісті түспен белгіле!</h2><div class="status"><span id="progress">1 / 20</span><span id="clock">Уақыт: 00:00</span></div><div class="photo"><img id="picture" alt="Тапсырма суреті"></div><div id="answer" class="answer"></div><div class="instruction">ӘРІПТЕР МЕН ДЫБЫС ТҮСТЕРІН ТАҢДА!</div><p class="help">Әріпті немесе түсті сүйреп апар, не басып ұяшықты таңда!</p><div id="tray" class="tray"></div><div id="message" class="message" aria-live="polite"></div><div id="navigator" class="navigator" aria-label="Тапсырмаларға өту"></div><div class="controls"><button id="prev" class="prev">◀ АЛДЫҢҒЫ</button><button id="next" class="next">КЕЛЕСІ ➜</button></div></main><div id="overlay" class="overlay"><div class="dialog"><h3>ЖАРАЙСЫҢ! 🎉<br>ТАПСЫРМАЛАРДЫ ҚАРАП ШЫҚТЫҢ!</h3><p id="result"></p><button id="pending" style="background:#a31a73">ӨТКІЗІП АЛҒАН ТАПСЫРМАЛАР</button> <button id="restart">ҚАЙТА ОЙНАУ</button></div></div><script>
const tasks=[{"word": "гүл", "image": "images/01.png"}, {"word": "аққу", "image": "images/02.png"}, {"word": "әтеш", "image": "images/03.png"}, {"word": "түлкі", "image": "images/04.png"}, {"word": "құс", "image": "images/05.png"}, {"word": "жылқы", "image": "images/06.png"}, {"word": "терезе", "image": "images/07.png"}, {"word": "қайшы", "image": "images/08.png"}, {"word": "доп", "image": "images/09.png"}, {"word": "ағаш", "image": "images/10.png"}, {"word": "қауын", "image": "images/11.png"}, {"word": "балық", "image": "images/12.png"}, {"word": "бақа", "image": "images/13.png"}, {"word": "сағат", "image": "images/14.png"}, {"word": "бұлт", "image": "images/15.png"}, {"word": "бұзау", "image": "images/16.png"}, {"word": "қарбыз", "image": "images/17.jpg"}, {"word": "бұрыш", "image": "images/18.jpg"}, {"word": "ұшақ", "image": "images/19.png"}, {"word": "етік", "image": "images/20.png"}];
const vowels=new Set([...'аәеёиіоөұүыэюя']);
let idx=0,started=Date.now(),timer=null,selection=null,letters=[],colors=[],tiles=[],drag=null;
let states=tasks.map(()=>({letters:[],colors:[],letterOk:false,colorOk:false,visited:false}));
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let audioCtx;
function sound(ok){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let now=audioCtx.currentTime;let tones=ok?[{f:660,t:0},{f:880,t:.13}]:[{f:240,t:0},{f:175,t:.16}];for(let tone of tones){let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(tone.f,now+tone.t);o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,now+tone.t);g.gain.exponentialRampToValueAtTime(.28,now+tone.t+.015);g.gain.exponentialRampToValueAtTime(.001,now+tone.t+.19);o.start(now+tone.t);o.stop(now+tone.t+.2)}}catch(e){}}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function correctColor(ch,word){if(ch==='у')return word==='аққу'?'red':'blue';return vowels.has(ch)?'red':'blue'}
function getState(){return states[idx]}
function allLettersCorrect(){let word=tasks[idx].word;return letters.length===word.length&&letters.every((t,i)=>t&&t.value===word[i])}
function allColorsCorrect(){let word=tasks[idx].word;return colors.length===word.length&&colors.every((c,i)=>c===correctColor(word[i],word))}
function message(s,error=false){$('message').textContent=s;$('message').className='message'+(error?' error':'')}
function evaluate(){let state=getState(),word=tasks[idx].word;
  if(!state.letterOk&&letters.every(Boolean)){
    if(allLettersCorrect()){state.letterOk=true;sound(true);message('ЖАРАЙСЫҢ! СӨЗДІ ДҰРЫС ҚҰРАДЫҢ! ⭐')}
    else{sound(false);message('СӨЗ ДҰРЫС ЕМЕС. ӘРІПТЕРДІ ҚАЙТА ОРНАЛАСТЫР!',true)}
  }
  if(state.letterOk&&!state.colorOk&&colors.every(Boolean)){
    if(allColorsCorrect()){state.colorOk=true;sound(true);message('КЕРЕМЕТ! ДЫБЫСТЫҚ ТАЛДАУ ДҰРЫС! ⭐')}
    else{sound(false);message('ДЫБЫСТЫҚ ТАЛДАУДА ҚАТЕ БАР. ТҮСТЕРДІ ӨЗГЕРТ!',true)}
  }
  drawNavigator();
}
function render(){selection=null;drag=null;let t=tasks[idx],st=getState();st.visited=true;document.documentElement.style.setProperty('--letters-count',t.word.length);
 $('progress').textContent=(idx+1)+' / '+tasks.length;$('picture').src=t.image;$('picture').alt='Сурет '+(idx+1);message('');
 if(!st.tiles){st.tiles=shuffle([...t.word].map((ch,id)=>({id:'l'+id,type:'letter',value:ch})));st.tiles.push({id:'red',type:'color',value:'red'},{id:'blue',type:'color',value:'blue'})}
 tiles=st.tiles;letters=st.letters.length?st.letters:Array(t.word.length).fill(null);colors=st.colors.length?st.colors:Array(t.word.length).fill(null);st.letters=letters;st.colors=colors;
 $('prev').disabled=idx===0;$('next').textContent=idx===tasks.length-1?'ҚОРЫТЫНДЫ ➜':'КЕЛЕСІ ➜';draw();drawNavigator();
 if(st.letterOk&&st.colorOk)message('ТАПСЫРМА ДҰРЫС ОРЫНДАЛҒАН! ⭐');
}
function drawNavigator(){let nav=$('navigator');nav.innerHTML='';states.forEach((st,i)=>{let b=document.createElement('button');b.className='navbtn'+(st.letterOk&&st.colorOk?' done':st.visited?' pending':'')+(i===idx?' active':'');b.textContent=i+1;b.title=(i+1)+'-тапсырма'+(st.letterOk&&st.colorOk?' — дайын':' — аяқталмаған');b.onclick=()=>go(i);nav.append(b)})}
function draw(){let a=$('answer');a.innerHTML='';letters.forEach((v,i)=>{let col=document.createElement('div');col.className='column';let l=document.createElement('button');l.className='target';l.dataset.type='letter';l.dataset.pos=i;l.textContent=v?v.value:'';let c=document.createElement('button');c.className='circle '+(colors[i]||'');c.dataset.type='color';c.dataset.pos=i;col.append(l,c);a.append(col)});
 let tray=$('tray');tray.innerHTML='';for(let tile of tiles){let b=document.createElement('button');b.className='tile '+(tile.type==='color'?'color-tile '+tile.value:'');b.dataset.id=tile.id;if(tile.type==='letter')b.textContent=tile.value;let used=letters.some(x=>x&&x.id===tile.id);if(used)b.classList.add('used');if(selection===tile.id)b.classList.add('selected');tray.append(b)}}
function place(tileId,type,pos){let t=tiles.find(x=>x.id===tileId);if(!t||t.type!==type)return;pos=+pos;let st=getState();
 if(type==='letter'){if(st.letterOk)return;let prev=letters[pos];if(prev&&prev.id===tileId)letters[pos]=null;else{letters=letters.map(x=>x&&x.id===tileId?null:x);letters[pos]=t}st.letters=letters;colors.fill(null);st.colorOk=false}
 else{if(!st.letterOk||st.colorOk)return;colors[pos]=t.value;st.colors=colors}
 selection=null;draw();evaluate()}
function targetFromPoint(x,y){let el=document.elementFromPoint(x,y);return el?.closest('[data-pos]')}
$('tray').addEventListener('pointerdown',e=>{let el=e.target.closest('[data-id]');if(!el||el.classList.contains('used'))return;let id=el.dataset.id,t=tiles.find(x=>x.id===id);if((t.type==='letter'&&getState().letterOk)||(t.type==='color'&&(!getState().letterOk||getState().colorOk)))return;
 selection=id;drag={id,x:e.clientX,y:e.clientY,moved:false};try{el.setPointerCapture(e.pointerId)}catch{};drawSelection()});
function drawSelection(){document.querySelectorAll('.tile').forEach(el=>el.classList.toggle('selected',el.dataset.id===selection))}
document.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8&&!drag.moved)return;drag.moved=true;let ghost=$('ghost');if(!ghost){ghost=document.createElement('div');ghost.id='ghost';ghost.className='tile dragging';document.body.append(ghost)}let t=tiles.find(x=>x.id===drag.id);ghost.textContent=t.type==='letter'?t.value:'';ghost.className='tile dragging '+(t.type==='color'?'color-tile '+t.value:'');ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'});
document.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;let ghost=$('ghost');if(ghost)ghost.remove();let target=targetFromPoint(e.clientX,e.clientY);if(d.moved&&target)place(d.id,target.dataset.type,target.dataset.pos);else{selection=d.id;drawSelection()}});
$('answer').addEventListener('click',e=>{let el=e.target.closest('[data-pos]');if(!el)return;let type=el.dataset.type,pos=+el.dataset.pos;if(selection){place(selection,type,pos)}else if(type==='letter'&&!getState().letterOk){letters[pos]=null;getState().letters=letters;draw()}else if(type==='color'&&!getState().colorOk){colors[pos]=null;draw()}});
function go(n){if(n<0||n>=tasks.length)return;idx=n;render()}
$('prev').onclick=()=>go(idx-1);
$('next').onclick=()=>{if(idx===tasks.length-1)finish();else go(idx+1)};
function finish(){let completed=states.filter(s=>s.letterOk&&s.colorOk).length;let missing=tasks.length-completed;$('result').textContent='Орындалғаны: '+completed+' / '+tasks.length+'. '+(missing?'Аяқталмағаны: '+missing+'. Оларға қайта оралуға болады.':'Барлық тапсырма орындалды!')+' Уақыт: '+fmt(Math.floor((Date.now()-started)/1000));$('pending').hidden=!missing;$('overlay').classList.add('show')}
$('pending').onclick=()=>{let n=states.findIndex(s=>!(s.letterOk&&s.colorOk));$('overlay').classList.remove('show');if(n>=0)go(n)};
$('restart').onclick=()=>{states=tasks.map(()=>({letters:[],colors:[],letterOk:false,colorOk:false,visited:false}));idx=0;started=Date.now();$('overlay').classList.remove('show');$('clock').textContent='Уақыт: 00:00';render()};
timer=setInterval(()=>{$('clock').textContent='Уақыт: '+fmt(Math.floor((Date.now()-started)/1000))},1000);render();
</script></body></html>
